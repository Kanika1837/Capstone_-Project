<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Progress - SwapSkill</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #ffffff;
            color: #172b4d;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 60px;
            border-bottom: 1px solid #eee;
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
        }

        .logo span {
            color: #e5b93f;
        }

        nav a {
            text-decoration: none;
            color: #172b4d;
            margin-left: 25px;
            font-weight: 500;
        }

        nav a:hover {
            color: #e5b93f;
        }

        .container {
            max-width: 700px;
            margin: 60px auto;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.08);
        }

        h1 {
            margin-bottom: 15px;
        }

        p {
            margin: 12px 0;
        }

        .progress-box {
            width: 100%;
            height: 25px;
            background: #eeeeee;
            border-radius: 20px;
            overflow: hidden;
            margin: 25px 0;
        }

        .progress-bar {
            width: 0%;
            height: 100%;
            background: #e5b93f;
            transition: width 0.4s;
        }

        button {
            padding: 12px 22px;
            border: none;
            border-radius: 8px;
            background: #e5b93f;
            color: #172b4d;
            font-weight: bold;
            cursor: pointer;
            margin: 5px;
        }

        button:disabled {
            background: #cccccc;
            cursor: not-allowed;
        }

        #message {
            margin-top: 20px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<header>
    <div class="logo">Swap<span>Skill</span></div>

    <nav>
        <a href="dashboard.html">Dashboard</a>
        <a href="profile.html">My Profile</a>
        <a href="login.html">Logout</a>
    </nav>
</header>

<div class="container">
    <h1>Course Progress</h1>

    <p><strong>Course:</strong> Java Programming</p>
    <p>Complete all lessons to generate your certificate.</p>

    <div class="progress-box">
        <div class="progress-bar" id="progressBar"></div>
    </div>

    <p>Progress: <span id="progressText">0%</span></p>

    <button onclick="completeLesson()">Complete Lesson</button>
    <button id="certificateButton" onclick="generateCertificate()" disabled>
        Generate Certificate
    </button>

    <p id="message"></p>
</div>

<script>
    let progress = 0;

    function completeLesson() {
        if (progress < 100) {
            progress += 20;
        }

        document.getElementById("progressBar").style.width = progress + "%";
        document.getElementById("progressText").textContent = progress + "%";

        if (progress === 100) {
            document.getElementById("certificateButton").disabled = false;
            document.getElementById("message").textContent =
                "Congratulations! You completed the course.";
        }
    }

    function generateCertificate() {
        if (progress === 100) {
            localStorage.setItem("courseCompleted", "true");

            window.location.href = "certificate.html";
        }
    }
</script>

</body>
</html>
