<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Communication Skills Course | Swap Skill</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f8f9fc;
            color: #172b4d;
        }

        header {
            background: #172b4d;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .container {
            width: 90%;
            max-width: 900px;
            margin: 30px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px #00000015;
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .description {
            text-align: center;
            margin-bottom: 25px;
            color: #555;
        }

        .progress-box {
            margin-bottom: 25px;
        }

        .progress-bar {
            width: 100%;
            height: 15px;
            background: #e5e5e5;
            border-radius: 10px;
            overflow: hidden;
        }

        .progress {
            width: 0%;
            height: 100%;
            background: #e5b93f;
            transition: 0.3s;
        }

        .lesson {
            border: 1px solid #ddd;
            padding: 15px;
            margin: 12px 0;
            border-radius: 8px;
            cursor: pointer;
        }

        .lesson:hover {
            background: #fff9df;
        }

        .lesson h3 {
            margin-bottom: 8px;
        }

        .lesson-content {
            display: none;
            margin-top: 15px;
            line-height: 1.6;
            color: #444;
        }

        button {
            background: #172b4d;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 15px;
        }

        button:hover {
            background: #e5b93f;
            color: #172b4d;
        }

        #certificateBtn {
            display: none;
            background: #e5b93f;
            color: #172b4d;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <header>
        <h2>Swap Skill</h2>
    </header>

    <div class="container">

        <h1>Communication Skills Course</h1>

        <p class="description">
            Develop clear, confident and effective communication skills.
        </p>

        <div class="progress-box">
            <strong>
                Course Progress:
                <span id="progressText">0%</span>
            </strong>

            <div class="progress-bar">
                <div class="progress" id="progressBar"></div>
            </div>
        </div>

        <div id="lessons"></div>

        <button id="certificateBtn" onclick="generateCertificate()">
            Generate Certificate
        </button>

    </div>

    <script>
        const lessons = [
            {
                title: "Lesson 1: Introduction to Communication",
                content: "Communication is the process of sharing information, thoughts and feelings with others. It can happen through speaking, writing, gestures and body language. Effective communication helps build strong relationships."
            },
            {
                title: "Lesson 2: Verbal Communication",
                content: "Verbal communication involves using spoken words. Speak clearly, use simple language and maintain a suitable tone. Avoid unnecessary words and make sure your message is easy to understand."
            },
            {
                title: "Lesson 3: Non-Verbal Communication",
                content: "Non-verbal communication includes facial expressions, eye contact, gestures, posture and body movements. Positive body language helps create trust and makes communication more effective."
            },
            {
                title: "Lesson 4: Active Listening",
                content: "Active listening means paying full attention to the speaker. Avoid interrupting, maintain eye contact and ask questions when needed. Repeat important points to confirm your understanding."
            },
            {
                title: "Lesson 5: Improving Vocabulary and Fluency",
                content: "Read books, articles and newspapers to improve your vocabulary. Learn new words regularly and practise speaking every day. Do not worry about mistakes; focus on gradual improvement."
            },
            {
                title: "Lesson 6: Professional Communication",
                content: "Professional communication is important in workplaces, interviews and meetings. Use polite language, write clear emails and respect other people's opinions. Be confident, respectful and professional."
            }
        ];

        const storageKey = "communicationSkillsCompletedLessons";

        let completedLessons =
            JSON.parse(localStorage.getItem(storageKey)) || [];

        const lessonsContainer =
            document.getElementById("lessons");

        function displayLessons() {
            lessonsContainer.innerHTML = "";

            lessons.forEach((lesson, index) => {
                const lessonBox = document.createElement("div");

                lessonBox.className = "lesson";

                const isCompleted =
                    completedLessons.includes(index);

                lessonBox.innerHTML = `
                    <h3>
                        ${lesson.title}
                        ${isCompleted ? "✅" : ""}
                    </h3>

                    <div class="lesson-content" id="content-${index}">
                        <p>${lesson.content}</p>

                        <button onclick="completeLesson(${index}, event)">
                            ${isCompleted ? "Completed" : "Complete Lesson"}
                        </button>
                    </div>
                `;

                lessonBox.addEventListener("click", function () {
                    const content =
                        document.getElementById(`content-${index}`);

                    if (content.style.display === "block") {
                        content.style.display = "none";
                    } else {
                        content.style.display = "block";
                    }
                });

                lessonsContainer.appendChild(lessonBox);
            });

            updateProgress();
        }

        function completeLesson(index, event) {
            event.stopPropagation();

            if (!completedLessons.includes(index)) {
                completedLessons.push(index);

                localStorage.setItem(
                    storageKey,
                    JSON.stringify(completedLessons)
                );
            }

            displayLessons();
        }

        function updateProgress() {
            const percentage = Math.round(
                (completedLessons.length / lessons.length) * 100
            );

            document.getElementById("progressText").innerText =
                percentage + "%";

            document.getElementById("progressBar").style.width =
                percentage + "%";

            if (completedLessons.length === lessons.length) {
                document.getElementById("certificateBtn").style.display =
                    "block";
            }
        }

        function generateCertificate() {
            localStorage.setItem(
                "certificateCourse",
                "Communication Skills"
            );

            window.location.href = "certificate.html";
        }

        displayLessons();
    </script>

</body>

</html>
