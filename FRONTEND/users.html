<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Users | Swap Skill</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 30px;
            background: #f8fafc;
            color: #172554;
        }

        h1 {
            text-align: center;
        }

        .container {
            max-width: 900px;
            margin: 30px auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            padding: 14px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #172554;
            color: white;
        }

        .back-btn {
            background: #eab308;
            color: #172554;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Manage Users</h1>

        <button class="back-btn" onclick="history.back()">Back</button>

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Email</th>
                </tr>
            </thead>

            <tbody id="usersTable">
                <tr>
                    <td colspan="3">Loading users...</td>
                </tr>
            </tbody>
        </table>
    </div>

    <script>
        async function loadUsers() {
            const table = document.getElementById("usersTable");

            try {
                const response = await fetch("http://localhost:5000/api/users");

                if (!response.ok) {
                    throw new Error("Server error: " + response.status);
                }

                const users = await response.json();

                table.innerHTML = "";

                if (users.length === 0) {
                    table.innerHTML = `
                        <tr>
                            <td colspan="3">No users found</td>
                        </tr>
                    `;
                    return;
                }

                users.forEach(user => {
                    const row = document.createElement("tr");

                    row.innerHTML = `
                        <td>${user.id}</td>
                        <td>${user.name}</td>
                        <td>${user.email}</td>
                    `;

                    table.appendChild(row);
                });

            } catch (error) {
                table.innerHTML = `
                    <tr>
                        <td colspan="3">Failed to load users</td>
                    </tr>
                `;

                console.error("Error loading users:", error);
            }
        }

        loadUsers();
    </script>

</body>
</html>
