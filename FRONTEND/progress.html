<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Progress - SwapSkill</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #ffffff;
            color: #172b4d;
        }

        header {
            padding: 20px 7%;
            background: #ffffff;
            box-shadow: 0 2px 10px #ddd;
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
        }

        .logo span {
            color: #e5b93f;
        }

        .container {
            max-width: 700px;
            margin: 50px auto;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 20px #ddd;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        .progress-card {
            padding: 25px;
            border: 1px solid #ddd;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        .progress-card h2 {
            margin-bottom: 12px;
        }

        .progress-bar {
            width: 100%;
            height: 20px;
            background: #eeeeee;
            border-radius: 20px;
            overflow: hidden;
            margin-top: 15px;
        }

        .progress-fill {
            width: 40%;
            height: 100%;
            background: #e5b93f;
            transition: width 0.3s ease;
        }

        .progress-input {
            width: 100%;
            margin-top: 20px;
            cursor: pointer;
        }

        .status {
            margin-top: 12px;
            font-weight: bold;
        }

        button {
            display: block;
            margin: 25px auto 0;
            padding: 13px 25px;
            border: none;
            border-radius: 25px;
            background: #e5b93f;
            color: #172b4d;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #172b4d;
            color: white;
        }
    </style>
</head>

<body>

    <header>
        <div class="logo">Swap<span>Skill</span></div>
    </header>

    <div class="container">
        <h1>My Progress</h1>

        <div class="progress-card">
            <h2 id="skillTitle">Learning Progress</h2>

            <p>Track your skill-learning progress here.</p>

            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>

            <p style="margin-top: 10px;">
                Progress: <span id="progressText">40%</span>
            </p>

            <input
                type="range"
                id="progressInput"
                class="progress-input"
                min="0"
                max="100"
                value="40"
            >

            <p class="status" id="statusText">
                Status: In Progress
            </p>
        </div>

        <button onclick="goDashboard()">
            Back to Dashboard
        </button>
    </div>

    <script>
        const selectedSkill = localStorage.getItem("selectedSkill");

        if (selectedSkill) {
            document.getElementById("skillTitle").innerText =
                selectedSkill + " Progress";
        }

        const progressInput = document.getElementById("progressInput");
        const progressFill = document.getElementById("progressFill");
        const progressText = document.getElementById("progressText");
        const statusText = document.getElementById("statusText");

        const savedProgress = localStorage.getItem("skillProgress");

        if (savedProgress !== null) {
            progressInput.value = savedProgress;
        }

        function updateProgress() {
            const progress = progressInput.value;

            progressFill.style.width = progress + "%";
            progressText.innerText = progress + "%";

            if (progress == 100) {
                statusText.innerText = "Status: Completed";
            } else {
                statusText.innerText = "Status: In Progress";
            }

            localStorage.setItem("skillProgress", progress);
        }

        progressInput.addEventListener("input", updateProgress);

        updateProgress();

        function goDashboard() {
            window.location.href = "dashboard.html";
        }
    </script>

</body>
</html>
