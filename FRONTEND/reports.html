<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reports | Swap Skill</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f8f9fc;
            color: #333;
            padding: 30px;
        }

        .container {
            max-width: 1100px;
            margin: auto;
        }

        .header {
            background: white;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 25px;
            box-shadow: 0 3px 15px rgba(0,0,0,0.05);
        }

        h1 {
            color: #172b4d;
            margin-bottom: 15px;
        }

        .back-btn {
            background: #f4c95d;
            color: #172b4d;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 25px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 3px 15px rgba(0,0,0,0.05);
        }

        .card h3 {
            color: #777;
            font-size: 15px;
            margin-bottom: 15px;
        }

        .card h2 {
            color: #172b4d;
            font-size: 30px;
        }

        .report-box {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 3px 15px rgba(0,0,0,0.05);
        }

        .report-box h2 {
            color: #172b4d;
            margin-bottom: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 14px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #172b4d;
            color: white;
        }

        @media (max-width: 800px) {
            .cards {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 500px) {
            .cards {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>📊 Swap Skill Reports</h1>
        <button class="back-btn" onclick="history.back()">← Back</button>
    </div>

    <div class="cards">

        <div class="card">
            <h3>Total Users</h3>
            <h2 id="totalUsers">Loading...</h2>
        </div>

        <div class="card">
            <h3>Total Skills</h3>
            <h2 id="totalSkills">45</h2>
        </div>

        <div class="card">
            <h3>Skill Exchanges</h3>
            <h2 id="totalExchanges">78</h2>
        </div>

        <div class="card">
            <h3>Active Users</h3>
            <h2 id="activeUsers">--</h2>
        </div>

    </div>

    <div class="report-box">

        <h2>Recent Activity Report</h2>

        <table>
            <thead>
                <tr>
                    <th>Activity</th>
                    <th>Status</th>
                    <th>Date</th>
                </tr>
            </thead>

            <tbody>
                <tr>
                    <td>New user registration</td>
                    <td>Completed</td>
                    <td>Recent</td>
                </tr>

                <tr>
                    <td>Skill added</td>
                    <td>Completed</td>
                    <td>Recent</td>
                </tr>

                <tr>
                    <td>Skill exchange</td>
                    <td>Completed</td>
                    <td>Recent</td>
                </tr>
            </tbody>
        </table>

    </div>

</div>

<script>

    async function loadReports() {

        try {

            const response = await fetch("http://localhost:5000/api/users");

            if (!response.ok) {
                throw new Error("Failed to fetch users");
            }

            const users = await response.json();

            document.getElementById("totalUsers").textContent = users.length;

            document.getElementById("activeUsers").textContent = users.length;

        } catch (error) {

            document.getElementById("totalUsers").textContent = "Error";

            document.getElementById("activeUsers").textContent = "Error";

            console.error(error);

        }

    }

    loadReports();

</script>

</body>
</html>
