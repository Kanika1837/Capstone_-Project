</div>

<script>

const API_URL = "http://localhost:5000";


// ======================================================
// CURRENT USER
// ======================================================

const currentUser =
    JSON.parse(localStorage.getItem("user")) ||
    JSON.parse(localStorage.getItem("latestUser"));


// ======================================================
// GET REQUEST ID AND SKILL FROM URL
// ======================================================

const urlParams = new URLSearchParams(window.location.search);

let requestId =
    urlParams.get("requestId") ||
    localStorage.getItem("currentLearningRequestId");

let selectedSkill =
    urlParams.get("skill") ||
    localStorage.getItem("currentLearningSkill");


// ======================================================
// MENTOR ID
// ======================================================

let mentorId = null;

let mentorName = "Mentor";


// ======================================================
// LOAD REQUEST
// ======================================================

async function loadRequest() {

    if (!requestId) {

        document.getElementById("mentorText").innerHTML =
            "<span class='error'>Request ID missing.</span>";

        return false;
    }

    try {

        const response = await fetch(
            `${API_URL}/api/requests/${requestId}`
        );

        const data = await response.json();

        console.log("REQUEST DATA:", data);

        if (!response.ok) {

            throw new Error(
                data.message || "Unable to load the learning request."
            );

        }

        // ------------------------------------------------
        // IMPORTANT:
        // Database uses receiver_id
        // ------------------------------------------------

        mentorId = data.receiver_id;

        mentorName =
            data.receiver_name ||
            "Mentor";

        selectedSkill =
            data.skill_name ||
            selectedSkill ||
            "Selected Skill";

        // Save values
        localStorage.setItem(
            "currentLearningRequestId",
            requestId
        );

        localStorage.setItem(
            "currentLearningSkill",
            selectedSkill
        );

        // Display
        document.getElementById("conversationTitle").innerText =
            `Conversation - ${selectedSkill}`;

        document.getElementById("mentorText").innerText =
            `You are connected with ${mentorName} (Mentor #${mentorId}) for this skill.`;

        document.getElementById("skillText").innerText =
            selectedSkill;

        return true;

    } catch (error) {

        console.error(
            "LOAD REQUEST ERROR:",
            error
        );

        document.getElementById("mentorText").innerHTML =
            `<span class="error">${error.message}</span>`;

        return false;
    }
}


// ======================================================
// LOAD MESSAGES
// ======================================================

async function loadMessages() {

    if (!requestId) {
        return;
    }

    try {

        const response = await fetch(
            `${API_URL}/api/conversations/${requestId}`
        );

        const data = await response.json();

        console.log("MESSAGES:", data);

        if (!response.ok) {

            throw new Error(
                data.message || "Unable to load messages"
            );

        }

        const messages =
            Array.isArray(data)
                ? data
                : data.conversations || data.messages || [];

        const messagesContainer =
            document.getElementById("messages");

        messagesContainer.innerHTML = "";

        // ------------------------------------------------
        // NO MESSAGES
        // ------------------------------------------------

        if (messages.length === 0) {

            messagesContainer.innerHTML = `
                <div class="empty-message">
                    No messages yet.<br>
                    Start the conversation with your mentor.
                </div>
            `;

            document.getElementById(
                "learningArea"
            ).style.display = "none";

            return;
        }

        // ------------------------------------------------
        // DISPLAY MESSAGES
        // ------------------------------------------------

        messages.forEach(message => {

            const messageDiv =
                document.createElement("div");

            const senderId =
                Number(
                    message.sender_id ||
                    message.senderId
                );

            const messageText =
                message.message ||
                message.content ||
                "";

            if (
                currentUser &&
                senderId === Number(currentUser.id)
            ) {

                messageDiv.className =
                    "message my-message";

            } else {

                messageDiv.className =
                    "message other-message";
            }

            messageDiv.innerHTML = `
                ${messageText}
                <small>
                    ${message.created_at || ""}
                </small>
            `;

            messagesContainer.appendChild(
                messageDiv
            );

        });

        messagesContainer.scrollTop =
            messagesContainer.scrollHeight;

        // ------------------------------------------------
        // CONVERSATION EXISTS
        // SHOW START LEARNING
        // ------------------------------------------------

        document.getElementById(
            "learningArea"
        ).style.display = "block";

    } catch (error) {

        console.error(
            "LOAD MESSAGES ERROR:",
            error
        );

        document.getElementById("messages").innerHTML = `
            <div class="error">
                Unable to load messages.
            </div>
        `;
    }
}


// ======================================================
// SEND MESSAGE
// ======================================================

async function sendMessage(event) {

    event.preventDefault();

    const input =
        document.getElementById("messageInput");

    const message =
        input.value.trim();

    if (!message) {
        return;
    }

    if (!currentUser) {

        alert("Please login first.");

        return;
    }

    if (!requestId) {

        alert("Request ID missing.");

        return;
    }

    if (!mentorId) {

        alert("Mentor information is missing.");

        return;
    }

    try {

        const response = await fetch(
            `${API_URL}/api/conversations`,
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({

                    requestId:
                        Number(requestId),

                    senderId:
                        Number(currentUser.id),

                    receiverId:
                        Number(mentorId),

                    message:
                        message
                })
            }
        );

        const data =
            await response.json();

        console.log(
            "SEND MESSAGE RESPONSE:",
            data
        );

        if (!response.ok) {

            throw new Error(
                data.message ||
                "Failed to send message"
            );
        }

        input.value = "";

        await loadMessages();

    } catch (error) {

        console.error(
            "SEND MESSAGE ERROR:",
            error
        );

        alert(error.message);
    }
}


// ======================================================
// START LEARNING
// ======================================================

function startLearning() {

    if (!requestId) {

        alert("Request ID missing.");

        return;
    }

    localStorage.setItem(
        "currentLearningRequestId",
        requestId
    );

    localStorage.setItem(
        "currentLearningSkill",
        selectedSkill
    );

    // Java Programming
    if (
        selectedSkill.toLowerCase().includes("java")
    ) {

        window.location.href =
            "java-learning.html";

        return;
    }

    // Python Programming
    if (
        selectedSkill.toLowerCase().includes("python")
    ) {

        window.location.href =
            "python-learning.html";

        return;
    }

    // Web Development
    if (
        selectedSkill.toLowerCase().includes("web")
    ) {

        window.location.href =
            "web-learning.html";

        return;
    }

    // Default
    window.location.href =
        "learning.html";
}


// ======================================================
// BACK
// ======================================================

function goBack() {
    window.history.back();
}


// ======================================================
// INITIALIZE
// ======================================================

async function initializeConversation() {

    const requestLoaded =
        await loadRequest();

    if (!requestLoaded) {
        return;
    }

    await loadMessages();
}

initializeConversation();

</script>
