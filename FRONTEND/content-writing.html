<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Content Writing Course | Swap Skill</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f8f9fc;
            color: #172b4d;
        }

        header {
            background: #172b4d;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .container {
            width: 90%;
            max-width: 900px;
            margin: 30px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px #00000015;
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .description {
            text-align: center;
            margin-bottom: 25px;
            color: #555;
        }

        .progress-box {
            margin-bottom: 25px;
        }

        .progress-bar {
            width: 100%;
            height: 15px;
            background: #e5e5e5;
            border-radius: 10px;
            overflow: hidden;
        }

        .progress {
            width: 0%;
            height: 100%;
            background: #e5b93f;
            transition: 0.3s;
        }

        .lesson {
            border: 1px solid #ddd;
            padding: 15px;
            margin: 12px 0;
            border-radius: 8px;
            cursor: pointer;
        }

        .lesson:hover {
            background: #fff9df;
        }

        .lesson h3 {
            margin-bottom: 8px;
        }

        .lesson-content {
            display: none;
            margin-top: 15px;
            line-height: 1.6;
            color: #444;
        }

        button {
            background: #172b4d;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 15px;
        }

        button:hover {
            background: #e5b93f;
            color: #172b4d;
        }

        #certificateBtn {
            display: none;
            background: #e5b93f;
            color: #172b4d;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <header>
        <h2>Swap Skill</h2>
    </header>

    <div class="container">

        <h1>Content Writing Course</h1>

        <p class="description">
            Learn how to write clear, creative and engaging content.
        </p>

        <div class="progress-box">
            <strong>
                Course Progress:
                <span id="progressText">0%</span>
            </strong>

            <div class="progress-bar">
                <div class="progress" id="progressBar"></div>
            </div>
        </div>

        <div id="lessons"></div>

        <button id="certificateBtn" onclick="generateCertificate()">
            Generate Certificate
        </button>

    </div>

    <script>
        const lessons = [
            {
                title: "Lesson 1: Introduction to Content Writing",
                content: "Content writing is the process of creating written content for websites, blogs, social media and other platforms. Good content should be useful, clear and interesting to the reader."
            },
            {
                title: "Lesson 2: Understanding Your Audience",
                content: "Before writing, understand your target audience. Identify their interests, needs and problems. Use simple language and information that is useful for your readers."
            },
            {
                title: "Lesson 3: Writing Clear and Effective Content",
                content: "Use short sentences, simple words and clear paragraphs. Avoid unnecessary repetition. Organise your ideas logically so that readers can easily understand your message."
            },
            {
                title: "Lesson 4: Blog and Article Writing",
                content: "A blog or article usually contains a title, introduction, main content and conclusion. Use headings, examples and relevant information to make your writing attractive and informative."
            },
            {
                title: "Lesson 5: Creative Writing Techniques",
                content: "Creative writing includes storytelling, descriptions and interesting ideas. Use engaging openings, examples and suitable emotions to make your content more attractive to readers."
            },
            {
                title: "Lesson 6: Editing and Proofreading",
                content: "Always review your content before publishing. Check spelling, grammar, punctuation and sentence structure. Remove unnecessary words and make sure the content is easy to read."
            }
        ];

        const storageKey = "contentWritingCompletedLessons";

        let completedLessons =
            JSON.parse(localStorage.getItem(storageKey)) || [];

        const lessonsContainer =
            document.getElementById("lessons");

        function displayLessons() {
            lessonsContainer.innerHTML = "";

            lessons.forEach((lesson, index) => {
                const lessonBox = document.createElement("div");

                lessonBox.className = "lesson";

                const isCompleted =
                    completedLessons.includes(index);

                lessonBox.innerHTML = `
                    <h3>
                        ${lesson.title}
                        ${isCompleted ? "✅" : ""}
                    </h3>

                    <div class="lesson-content" id="content-${index}">
                        <p>${lesson.content}</p>

                        <button onclick="completeLesson(${index}, event)">
                            ${isCompleted ? "Completed" : "Complete Lesson"}
                        </button>
                    </div>
                `;

                lessonBox.addEventListener("click", function () {
                    const content =
                        document.getElementById(`content-${index}`);

                    if (content.style.display === "block") {
                        content.style.display = "none";
                    } else {
                        content.style.display = "block";
                    }
                });

                lessonsContainer.appendChild(lessonBox);
            });

            updateProgress();
        }

        function completeLesson(index, event) {
            event.stopPropagation();

            if (!completedLessons.includes(index)) {
                completedLessons.push(index);

                localStorage.setItem(
                    storageKey,
                    JSON.stringify(completedLessons)
                );
            }

            displayLessons();
        }

        function updateProgress() {
            const percentage = Math.round(
                (completedLessons.length / lessons.length) * 100
            );

            document.getElementById("progressText").innerText =
                percentage + "%";

            document.getElementById("progressBar").style.width =
                percentage + "%";

            if (completedLessons.length === lessons.length) {
                document.getElementById("certificateBtn").style.display =
                    "block";
            }
        }

        function generateCertificate() {
            localStorage.setItem(
                "certificateCourse",
                "Content Writing"
            );

            window.location.href = "certificate.html";
        }

        displayLessons();
    </script>

</body>

</html>
