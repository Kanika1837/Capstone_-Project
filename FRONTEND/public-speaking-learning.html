<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Public Speaking Course | Swap Skill</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f8f9fc;
            color: #172b4d;
        }

        header {
            background: #172b4d;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .container {
            width: 90%;
            max-width: 900px;
            margin: 30px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px #00000015;
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .description {
            text-align: center;
            margin-bottom: 25px;
            color: #555;
        }

        .progress-box {
            margin-bottom: 25px;
        }

        .progress-bar {
            width: 100%;
            height: 15px;
            background: #e5e5e5;
            border-radius: 10px;
            overflow: hidden;
        }

        .progress {
            width: 0%;
            height: 100%;
            background: #e5b93f;
            transition: 0.3s;
        }

        .lesson {
            border: 1px solid #ddd;
            padding: 15px;
            margin: 12px 0;
            border-radius: 8px;
            cursor: pointer;
        }

        .lesson:hover {
            background: #fff9df;
        }

        .lesson h3 {
            margin-bottom: 8px;
        }

        .lesson-content {
            display: none;
            margin-top: 15px;
            line-height: 1.6;
            color: #444;
        }

        button {
            background: #172b4d;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 15px;
        }

        button:hover {
            background: #e5b93f;
            color: #172b4d;
        }

        #certificateBtn {
            display: none;
            background: #e5b93f;
            color: #172b4d;
            font-weight: bold;
        }
    </style>
</head>

<body>

<header>
    <h2>Swap Skill</h2>
</header>

<div class="container">

    <h1>Public Speaking Course</h1>

    <p class="description">
        Improve your confidence and learn effective public speaking skills.
    </p>

    <div class="progress-box">
        <strong>Course Progress: <span id="progressText">0%</span></strong>
        <div class="progress-bar">
            <div class="progress" id="progressBar"></div>
        </div>
    </div>

    <div id="lessons"></div>

    <button id="certificateBtn" onclick="generateCertificate()">
        Generate Certificate
    </button>

</div>

<script>
    const lessons = [
        {
            title: "Lesson 1: Introduction to Public Speaking",
            content: "Public speaking is the process of speaking in front of an audience. It is useful in classrooms, meetings, interviews and professional events. Good public speaking requires confidence, preparation and clear communication."
        },
        {
            title: "Lesson 2: Building Self-Confidence",
            content: "Confidence is important for effective speaking. Practise speaking in front of a mirror, maintain good posture and believe in your ideas. Start with small groups and gradually speak in front of larger audiences."
        },
        {
            title: "Lesson 3: Voice and Body Language",
            content: "Use a clear voice, suitable volume and natural pauses while speaking. Maintain eye contact, stand straight and use simple hand gestures. Avoid looking at the floor or speaking too quickly."
        },
        {
            title: "Lesson 4: Preparing a Speech",
            content: "A good speech should have an introduction, main content and conclusion. Understand your audience, choose a clear topic and organise your ideas before speaking."
        },
        {
            title: "Lesson 5: Handling Stage Fear",
            content: "Stage fear is common. Take deep breaths, practise your speech several times and focus on your message. Do not worry about small mistakes. Learn from every speaking experience."
        },
        {
            title: "Lesson 6: Effective Presentation Skills",
            content: "Use simple words and interesting examples. Keep your audience engaged by asking questions and using stories. End your speech with a strong conclusion and thank your audience."
        }
    ];

    const storageKey = "publicSpeakingCompletedLessons";
    let completedLessons = JSON.parse(localStorage.getItem(storageKey)) || [];

    const lessonsContainer = document.getElementById("lessons");

    function displayLessons() {
        lessonsContainer.innerHTML = "";

        lessons.forEach((lesson, index) => {
            const lessonBox = document.createElement("div");
            lessonBox.className = "lesson";

            const isCompleted = completedLessons.includes(index);

            lessonBox.innerHTML = `
                <h3>${lesson.title} ${isCompleted ? "✅" : ""}</h3>
                <div class="lesson-content" id="content-${index}">
                    <p>${lesson.content}</p>
                    <button onclick="completeLesson(${index}, event)">
                        ${isCompleted ? "Completed" : "Complete Lesson"}
                    </button>
                </div>
            `;

            lessonBox.addEventListener("click", function () {
                const content = document.getElementById(`content-${index}`);

                if (content.style.display === "block") {
                    content.style.display = "none";
                } else {
                    content.style.display = "block";
                }
            });

            lessonsContainer.appendChild(lessonBox);
        });

        updateProgress();
    }

    function completeLesson(index, event) {
        event.stopPropagation();

        if (!completedLessons.includes(index)) {
            completedLessons.push(index);
            localStorage.setItem(storageKey, JSON.stringify(completedLessons));
        }

        displayLessons();
    }

    function updateProgress() {
        const percentage = Math.round(
            (completedLessons.length / lessons.length) * 100
        );

        document.getElementById("progressText").innerText = percentage + "%";
        document.getElementById("progressBar").style.width = percentage + "%";

        if (completedLessons.length === lessons.length) {
            document.getElementById("certificateBtn").style.display = "block";
        }
    }

    function generateCertificate() {
        localStorage.setItem("certificateCourse", "Public Speaking");
        window.location.href = "certificate.html";
    }

    displayLessons();
</script>

</body>
</html>
