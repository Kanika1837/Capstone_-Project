
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign Up | Skill Swap</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: "Segoe UI", Arial, sans-serif;

            background:
                radial-gradient(circle at 15% 20%, #fff 0%, transparent 25%),
                radial-gradient(circle at 85% 80%, #ffd8e5 0%, transparent 30%),
                linear-gradient(135deg, #fff4f7, #ffdce8);

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 25px;
        }

        /* Decorative circles */

        body::before,
        body::after {
            content: "";
            position: fixed;
            border-radius: 50%;
            z-index: -1;
        }

        body::before {
            width: 220px;
            height: 220px;
            background: #ffc4d6;
            opacity: 0.35;
            top: -70px;
            left: -60px;
        }

        body::after {
            width: 280px;
            height: 280px;
            background: #f7b6cb;
            opacity: 0.25;
            bottom: -100px;
            right: -80px;
        }

        .signup-card {
            width: 420px;
            max-width: 100%;

            padding: 42px 40px;

            background: rgba(255, 255, 255, 0.88);

            border: 1px solid rgba(255, 255, 255, 0.9);

            border-radius: 28px;

            box-shadow:
                0 25px 60px rgba(190, 75, 112, 0.18),
                0 5px 15px rgba(190, 75, 112, 0.08);

            backdrop-filter: blur(12px);
        }

        .brand {
            text-align: center;
            margin-bottom: 25px;
        }

        .brand-icon {
            width: 62px;
            height: 62px;

            margin: 0 auto 14px;

            display: flex;
            justify-content: center;
            align-items: center;

            border-radius: 20px;

            background: linear-gradient(
                135deg,
                #f58bab,
                #d95c82
            );

            color: white;
            font-size: 28px;

            box-shadow:
                0 10px 25px rgba(217, 92, 130, 0.28);
        }

        .brand h1 {
            color: #3d3035;
            font-size: 29px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .brand p {
            margin-top: 8px;
            color: #9a858c;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;

            margin-bottom: 8px;

            color: #514148;
            font-size: 14px;
            font-weight: 600;
        }

        .input-box {
            position: relative;
        }

        .input-icon {
            position: absolute;
            left: 14px;
            top: 50%;

            transform: translateY(-50%);

            font-size: 16px;
            opacity: 0.65;
        }

        input {
            width: 100%;

            padding: 14px 15px 14px 43px;

            border: 1.5px solid #f0d0da;
            border-radius: 13px;

            background: #fffafb;

            color: #40343a;
            font-size: 14px;

            outline: none;

            transition: all 0.25s ease;
        }

        input::placeholder {
            color: #b8a5ac;
        }

        input:focus {
            border-color: #e47b9b;

            background: white;

            box-shadow:
                0 0 0 4px rgba(228, 123, 155, 0.12);
        }

        button {
            width: 100%;

            margin-top: 8px;

            padding: 14px;

            border: none;
            border-radius: 13px;

            background: linear-gradient(
                135deg,
                #f18aaa,
                #d85b82
            );

            color: white;

            font-size: 16px;
            font-weight: 700;

            cursor: pointer;

            box-shadow:
                0 10px 22px rgba(216, 91, 130, 0.25);

            transition: all 0.25s ease;
        }

        button:hover {
            transform: translateY(-2px);

            box-shadow:
                0 14px 28px rgba(216, 91, 130, 0.32);
        }

        button:active {
            transform: translateY(0);
        }

        .divider {
            display: flex;
            align-items: center;

            gap: 12px;

            margin: 25px 0 20px;

            color: #b29ca4;
            font-size: 12px;
        }

        .divider::before,
        .divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: #efd9e0;
        }

        .login-link {
            text-align: center;

            color: #958087;
            font-size: 14px;
        }

        .login-link a {
            color: #d85b82;

            text-decoration: none;

            font-weight: 700;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        .bottom-text {
            text-align: center;

            margin-top: 22px;

            color: #b29da5;
            font-size: 11px;
        }

        @media (max-width: 480px) {
            .signup-card {
                padding: 32px 25px;
                border-radius: 22px;
            }

            .brand h1 {
                font-size: 25px;
            }
        }
    </style>
</head>

<body>

    <div class="signup-card">

        <div class="brand">

            <div class="brand-icon">
                ✨
            </div>

            <h1>Create Your Account</h1>

            <p>
                Start learning. Start sharing. Grow together.
            </p>

        </div>


        <form id="signupForm">

            <div class="form-group">

                <label for="name">
                    Full Name
                </label>

                <div class="input-box">

                    <span class="input-icon">👤</span>

                    <input
                        type="text"
                        id="name"
                        placeholder="Enter your full name"
                        required
                    >

                </div>

            </div>


            <div class="form-group">

                <label for="email">
                    Email Address
                </label>

                <div class="input-box">

                    <span class="input-icon">✉️</span>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <div class="input-box">

                    <span class="input-icon">🔒</span>

                    <input
                        type="password"
                        id="password"
                        placeholder="Create a password"
                        required
                    >

                </div>

            </div>


            <button type="submit">
                Create Account →
            </button>

        </form>


        <div class="divider">
            OR
        </div>


        <div class="login-link">

            Already have an account?

            <a href="login.html">
                Login here
            </a>

        </div>


        <div class="bottom-text">
            Skill Swap & Learning Platform
        </div>

    </div>


    <script src="js/singup.js"></script>

</body>
</html>
